services:
  postgres:
    image: postgres:17
    container_name: dotnet10template-postgres

    environment:
      POSTGRES_DB: dotnet10template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data


  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile

    container_name: dotnet10template-api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=dotnet10template;Username=postgres;Password=postgres

    ports:
      - "8080:8080"

    depends_on:
      - postgres


  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile

    container_name: dotnet10template-web

    ports:
      - "3000:80"

    depends_on:
      - api


volumes:
  postgres-data: